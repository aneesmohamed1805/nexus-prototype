<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Nexus connects independent UAE talent, businesses, investors and work venues."><title>NEXUS — Independent minds. Shared possibilities.</title><style>
:root{--blue:#1268c4;--ink:#111318;--pale:#eaf2fa}*{box-sizing:border-box}body{margin:0;font:15px 'DejaVu Sans',Arial,sans-serif;color:var(--ink);background:#fafbfc}button,a,input,select,textarea{font:inherit}a{color:inherit;text-decoration:none}button,a{cursor:pointer}button{border:0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f7ba42;outline-offset:4px}.wrap{max-width:1440px;margin:auto;padding:0 5%}header{height:90px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dce1e7;background:white}nav{display:flex;gap:28px;align-items:center}.word{font-size:27px;font-weight:900;letter-spacing:-2px}.word span{color:var(--blue)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:24px;padding:17px 23px;background:var(--blue);color:white;border-radius:4px;font-weight:bold}.ghost{background:white;color:var(--ink);border:1px solid #cdd5df}.small{font-size:12px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:bold}.hero{display:grid;grid-template-columns:1.15fr 1fr;min-height:650px;background:var(--pale)}.hero-copy{padding:80px 8% 60px 10%}h1{font-size:clamp(48px,5.5vw,82px);line-height:1.02;letter-spacing:-5px;margin:25px 0}h1 span{color:var(--blue)}p{line-height:1.7;color:#58616d}.hero-copy p{max-width:490px;font-size:17px}.actions{display:flex;gap:12px;margin:30px 0}.hero-art{position:relative;overflow:hidden;background:#133d67;min-height:570px}.hero-art img{width:100%;height:100%;object-fit:cover;position:absolute;filter:brightness(.75)}.hero-art:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#062641bb,transparent 70%)}.art-caption{position:absolute;bottom:45px;left:35px;color:white;z-index:1;font-size:36px;line-height:1.1;font-weight:bold;letter-spacing:-1.5px}.float{position:absolute;z-index:2;background:white;padding:18px 24px;border-radius:6px;box-shadow:0 15px 40px #0002;font-size:13px}.float.one{top:65px;left:28px}.float.two{top:240px;right:25px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:7px}.ticker{display:flex;justify-content:space-between;gap:20px;padding:24px 0;border-bottom:1px solid #dce1e7;font-size:12px;color:#59636e}.section{padding:80px 0}.section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:30px}h2{font-size:42px;line-height:1.12;letter-spacing:-2px;margin:15px 0}h3{font-size:21px;letter-spacing:-.5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{background:white;border:1px solid #dce1e7;border-radius:7px;padding:28px;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-4px);border-color:var(--blue)}.tag{display:inline-block;background:var(--pale);color:#18538d;border-radius:3px;padding:6px 9px;font-size:11px;margin:0 4px 5px 0}.meta{display:flex;justify-content:space-between;border-top:1px solid #e4e8ed;padding-top:20px;margin-top:25px;font-size:13px}.role-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.role-card{padding:25px 20px;background:var(--pale);border-radius:4px}.role-card b{display:block;font-size:18px;margin:25px 0 12px}.role-card p{font-size:13px}.dark{background:var(--ink);color:white}.dark p{color:#b6c3d0}.split{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}.step{padding:22px 0;border-bottom:1px solid #ffffff2b;display:flex;gap:25px}.step strong{color:#73b7ff;font-size:26px}.step h3{margin:0 0 8px}.step p{margin:0}.footer{padding:45px 0;display:flex;justify-content:space-between;color:#66717e;font-size:12px}.notice{background:#e9f2ff;color:#245480;padding:9px;text-align:center;font-size:11px}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.tab{padding:12px 18px;background:white;border:1px solid #dce1e7;border-radius:30px}.tab.active{background:var(--ink);color:white}.search{display:flex;gap:12px;margin:30px 0}.search input,.search select{padding:16px;border:1px solid #cdd5df;border-radius:4px;background:white}.search input{flex:1}.page{min-height:70vh}.hidden{display:none!important}.dashboard{display:grid;grid-template-columns:220px 1fr;gap:30px;padding:40px 0}.sidebar{border-right:1px solid #dce1e7;padding-right:20px}.sidebar button{display:block;padding:14px;width:100%;text-align:left;background:transparent;border-radius:5px;margin:5px 0}.sidebar button.active{background:var(--pale);color:var(--blue)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:25px 0}.stats strong{display:block;font-size:32px;margin:15px 0}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.column{background:#edf1f5;border-radius:6px;padding:15px}.column .card{margin:15px 0;padding:18px}.label{display:block;margin:18px 0 8px;font-weight:bold;font-size:13px}input,textarea,select{width:auto}form input,form textarea,form select{width:100%;padding:14px;border:1px solid #cdd5df;border-radius:4px}dialog{border:0;border-radius:10px;max-width:650px;width:90%;padding:36px;box-shadow:0 30px 120px #0004}dialog::backdrop{background:#11131899}dialog .close{float:right;background:var(--pale);padding:8px 12px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.avatar{width:54px;height:54px;border-radius:50%;background:var(--pale);color:var(--blue);display:grid;place-items:center;font-weight:bold;font-size:19px}.venue-img{height:180px;width:100%;object-fit:cover;border-radius:4px}.blue-panel{background:var(--blue);color:white;padding:45px;border-radius:6px}.blue-panel p{color:#d5e9ff}.progress{height:5px;background:#dce6f0;border-radius:5px;margin:18px 0}.progress span{display:block;background:var(--blue);height:100%;width:65%}.linkbtn{background:transparent;color:var(--blue);padding:0;font-weight:bold}.empty{padding:45px;border:1px dashed #bdc9d7;border-radius:6px}.toast{position:fixed;bottom:25px;right:25px;padding:20px;background:var(--ink);color:white;border-radius:6px;z-index:10;max-width:380px}@media(max-width:850px){nav{gap:14px}nav>a{display:none}.hero{grid-template-columns:1fr}.hero-copy{padding:50px 7%}h1{letter-spacing:-3px}.hero-art{min-height:400px}.grid,.role-grid{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}.dashboard{grid-template-columns:1fr}.sidebar{display:flex;border:0;overflow:auto}.sidebar button{width:auto;white-space:nowrap}.board{grid-template-columns:1fr}.ticker{flex-wrap:wrap}.stats{grid-template-columns:1fr 1fr}}@media(max-width:540px){.grid,.role-grid,.stats{grid-template-columns:1fr}h2{font-size:32px}.search{flex-direction:column}.section{padding:50px 0}.section-head{display:block}.form-grid{grid-template-columns:1fr}.actions{flex-wrap:wrap}.footer{gap:25px}.hero-art{min-height:360px}}
@media(max-width:850px){header{height:auto;min-height:90px;padding-top:18px;padding-bottom:18px;gap:20px;align-items:flex-start}nav{flex-wrap:wrap;justify-content:flex-end}nav>a{display:block;font-size:12px}nav .btn{padding:10px 14px}.dashboard>section{min-width:0}}@media(max-width:540px){h1{font-size:46px!important;letter-spacing:-2px}.float{max-width:85%;font-size:11px}.art-caption{font-size:28px}.meta{gap:12px}.sidebar{max-width:100%}.blue-panel{padding:25px}}</style></head><body><div class="notice">INTERACTIVE PROTOTYPE · Fictional sample records · No live verification or payments</div><header class="wrap"><a class="word" href="#home" aria-label="Nexus home">NE<span>X</span>US</a><nav><a href="#projects">Find projects</a><a href="#people">Find people</a><a href="#venues">Work venues</a><a href="#how">How it works</a><button class="linkbtn" onclick="go('dashboard')">Explore workspace</button><button class="btn" onclick="join()">Join Nexus ↗</button></nav></header><main id="app"></main><footer class="wrap footer"><div><a href="#home" class="word">NEXUS</a><p>People. Projects. Possibilities.</p></div><div>Built around independent ambition.<p><a href="#help">Help centre</a> · <a href="#loyalty">Nexus Dirham</a> · <a href="#research">Design rationale</a></p>UAE · Prototype v1 / 2026</div></footer><dialog id="modal"><button class="close" onclick="modal.close()" aria-label="Close dialog">×</button><div id="modalContent"></div></dialog><div id="toast" class="toast hidden" role="status"></div><script>
const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal');let memberRole='Freelancer',category='All',query='',saved=new Set(),stage=0;
const roles=['Freelancer','Small agency','Business','Investor','Venue'];const projects=[['Brand & design','A new identity for an independent coffee brand','Brand strategy, identity and a launch toolkit. Bring a point of view and a considered portfolio.','8,000–12,000','Dubai','3 weeks'],['Development','Build a better booking experience','A responsive booking platform for a growing wellness business. Open to individual or team proposals.','18,000–25,000','Abu Dhabi','6 weeks'],['Marketing','Make our next launch count','Campaign strategy, content and paid media support for a new UAE product launch.','10,000–16,000','Sharjah','4 weeks'],['Content','Tell the story behind our spaces','Photography and editorial content for a collection of independent work venues.','5,000–8,000','Dubai','2 weeks']];
function go(p){location.hash=p}function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),4500)}function open(t){$('#modalContent').innerHTML=t;modal.showModal()}function cards(limit=99){return projects.map((p,i)=>({p,i})).filter(({p})=>(category==='All'||p[0]===category)&&p.join(' ').toLowerCase().includes(query.toLowerCase())).slice(0,limit).map(({p,i})=>`<article class="card"><span class="tag">${p[0]}</span><div class="small" style="margin:15px 0;color:#647180">Sample brief · ${p[4]}</div><h3>${p[1]}</h3><p>${p[2]}</p><div class="meta"><b>AED ${p[3]}</b><span>${p[5]}</span></div><div class="meta"><button class="linkbtn" onclick="detail(${i})">View project ↗</button><button class="linkbtn" aria-label="Save ${p[1]}" onclick="save(${i},this)">${saved.has(i)?'Saved ✓':'Save +'}</button></div></article>`).join('')||'<p>No matching projects. Try another search.</p>'}
function save(i,b){saved.has(i)?saved.delete(i):saved.add(i);b.textContent=saved.has(i)?'Saved ✓':'Save +'}
function home(){app.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">Independent talent. Connected in the UAE.</div><h1>Independent<br>minds.<br><span>Shared<br>possibilities.</span></h1><p>Find your next project. Bring the right people together. Build something bigger than you could alone.</p><div class="actions"><a class="btn" href="#projects">Explore opportunities ↗</a><button class="btn ghost" onclick="join()">Find your place</button></div><div class="small">For freelancers, agencies, businesses, investors and work venues.</div></div><div class="hero-art"><img src="https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=1400&q=85" alt="Professionals collaborating around a shared table"><div class="float one"><span class="dot"></span>Independent by choice. Connected by Nexus.</div><div class="float two">Strategy + Design + Development<br><b style="display:block;margin-top:8px">A stronger team. A shared brief. ↗</b></div><div class="art-caption">Your next possibility<br>starts with a connection.</div></div></section><div class="wrap"><div class="ticker"><span>01 / FIND THE RIGHT PEOPLE</span><span>02 / TEAM UP ON A BRIEF</span><span>03 / MOVE WORK FORWARD</span><span>04 / BUILD YOUR REPUTATION</span></div><section class="section"><div class="section-head"><div><div class="eyebrow">One ecosystem. Your way in.</div><h2>Different strengths.<br>More ways to build.</h2></div><p>Choose where you belong.<br>See what becomes possible.</p></div><div class="role-grid">${roles.map((r,i)=>`<article class="role-card"><span class="eyebrow">0${i+1} ↗</span><b>${r}</b><p>${['Win work and find complementary skills.','Grow your capability and collaborate on bigger briefs.','Find people who can move your business forward.','Meet ideas and teams seeking potential backing.','Connect your space with a working community.'][i]}</p><button class="linkbtn" onclick="join('${r}')">Explore your path →</button></article>`).join('')}</div></section><section class="section" style="padding-top:0"><div class="section-head"><div><div class="eyebrow">The opportunity board</div><h2>A good brief.<br>A new beginning.</h2></div><a href="#projects" class="linkbtn">Explore all projects ↗</a></div><div class="grid">${cards(3)}</div></section></div><section class="section dark"><div class="wrap split"><div><div class="eyebrow">Built for the work after hello.</div><h2>Connection is the start.<br>Progress is the point.</h2><p>Keep the brief, the people and the next step in one shared workspace. Work independently or bring a team together.</p><a class="btn" href="#dashboard">Take a look inside ↗</a></div><div>${[['Find your fit','Discover briefs, portfolios and complementary capabilities.'],['Make the plan clear','Agree scope, responsibilities, milestones and project funding.'],['Deliver. Review. Move forward.','Track submissions, acceptance, ratings and payout status.']].map((s,i)=>`<div class="step"><strong>0${i+1}</strong><div><h3>${s[0]}</h3><p>${s[1]}</p></div></div>`).join('')}</div></div></section><section class="wrap section split"><div><div class="eyebrow">Room for your next idea</div><h2>Find a place<br>to make it happen.</h2><p>A quiet corner for deep work. A meeting room for your next collaboration. Discover venues with practical details before you go.</p><a class="btn ghost" href="#venues">Explore work venues ↗</a></div><img class="venue-img" style="height:360px" src="https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1100&q=85" alt="Bright collaborative workspace"></section>`}
function projectPage(){app.innerHTML=`<div class="wrap section page"><div class="eyebrow">Find your next possibility</div><h1 style="font-size:60px">Good work starts<br>with a <span>good connection.</span></h1><p>Explore sample briefs. Apply independently or bring a team.</p><div class="search"><input aria-label="Search projects" placeholder="Search skills, projects or locations" id="q"><button class="btn" onclick="query=$('#q').value;$('#results').innerHTML=cards()">Search ↗</button><button class="btn ghost" onclick="post()">Post a brief +</button></div><div class="tabs">${['All','Brand & design','Development','Marketing','Content'].map(c=>`<button class="tab ${category===c?'active':''}" onclick="category='${c}';projectPage()">${c}</button>`).join('')}</div><div class="grid" id="results">${cards()}</div></div>`;$('#q').value=query;$('#q').oninput=e=>{query=e.target.value;$('#results').innerHTML=cards()}}
function detail(i){const p=projects[i];open(`<span class="tag">Sample project · ${p[4]}</span><h2>${p[1]}</h2><p>${p[2]}</p><div class="meta"><b>AED ${p[3]}</b><span>${p[5]}</span></div><h3>What success looks like</h3><p>A clear plan, agreed milestones and accepted deliverables. This sample brief is for exploring the proposal journey.</p><h3>Your proposal</h3><form onsubmit="event.preventDefault();modal.close();toast('Demo proposal submitted. No application has been sent.')"><label class="label">Proposal type</label><select><option>Individual</option><option>Joint team proposal</option></select><label class="label">Your approach</label><textarea required rows="3" placeholder="Explain how you would approach the brief"></textarea><label class="label">Proposed fee (AED)</label><input required type="number" min="1"><button class="btn" style="margin-top:20px">Submit demo proposal ↗</button></form>`)}
function join(r='Freelancer'){memberRole=r;open(`<div class="eyebrow">Find your place in Nexus</div><h2>What will you<br>build next?</h2><p>Explore the registration journey. Do not enter real identity documents or financial information.</p><form onsubmit="event.preventDefault();modal.close();go('dashboard');toast('Demo profile created. Verification remains pending.')"><label class="label">I am joining as a</label><select onchange="memberRole=this.value">${roles.map(x=>`<option ${x===r?'selected':''}>${x}</option>`).join('')}</select><div class="form-grid"><div><label class="label">Display name</label><input required placeholder="Sample name"></div><div><label class="label">Emirate</label><select><option>Dubai</option><option>Abu Dhabi</option><option>Sharjah</option><option>Ajman</option><option>Fujairah</option><option>Ras Al Khaimah</option><option>Umm Al Quwain</option></select></div></div><p class="small">Eligibility: existing valid UAE freelance visa for freelancers; valid UAE trade licence for businesses. Nexus does not issue visas or licences.</p><button class="btn">Create demo profile ↗</button></form>`)}
function post(){open(`<h2>Start with a clear brief.</h2><form onsubmit="event.preventDefault();modal.close();toast('Demo brief saved. It has not been published to a live marketplace.')"><label class="label">Project title</label><input required><label class="label">What do you need?</label><textarea required rows="4"></textarea><div class="form-grid"><div><label class="label">Budget (AED)</label><input required type="number" min="1"></div><div><label class="label">Target date</label><input required type="date"></div></div><button class="btn" style="margin-top:20px">Save demo brief ↗</button></form>`)}
function people(){app.innerHTML=`<div class="wrap section page"><div class="eyebrow">Independent capability. Shared ambition.</div><h2>Find your next collaborator.</h2><p>Fictional profiles show how people and agencies could present their capabilities.</p><div class="grid">${[['AL','Amal Latif','Brand strategist','Freelancer','Strategy · Positioning · Research'],['OS','Orbit Studio','Digital experiences','Small agency','UX · Development · Content'],['RK','Rohan Kumar','Product designer','Freelancer','Product design · Prototyping · UI']].map(p=>`<article class="card"><div class="avatar">${p[0]}</div><h3>${p[1]}</h3><span class="tag">${p[3]}</span><p>${p[2]}<br>${p[4]}</p><div class="small">Dubai · Sample profile · Verification pending</div><div class="meta"><button class="linkbtn" onclick="open('<h2>${p[1]}</h2><p>${p[2]} · ${p[4]}</p><h3>Selected work</h3><p>Portfolio case studies would show the challenge, contribution and outcome, with genuine project evidence.</p><button class=btn onclick=invite()>Invite to a team ↗</button>')">View profile ↗</button><button class="linkbtn" onclick="invite()">Connect +</button></div></article>`).join('')}</div><div class="blue-panel" style="margin-top:30px"><h2>Keep your independence.<br>Add the missing capability.</h2><p>Build a joint proposal with named roles and accepted team invitations.</p><button class="btn ghost" onclick="invite()">Build a team ↗</button></div></div>`}function invite(){open('<h2>Build your next team.</h2><p>Invite collaborators and agree who leads, who delivers and who contracts.</p><form onsubmit="event.preventDefault();modal.close();toast(\'Demo invitation recorded. No message has been sent.\')"><label class="label">Team name</label><input required><label class="label">Your collaborator’s role</label><input required placeholder="e.g. UX design"><button class="btn" style="margin-top:20px">Create demo invitation ↗</button></form>')}
function venues(){app.innerHTML=`<div class="wrap section page"><div class="eyebrow">A space for every kind of progress</div><h2>Find your work mode.</h2><p>Sample venues only. Hours, facilities and access conditions illustrate the planned experience.</p><div class="grid">${['The Workroom','Common Ground','Studio Corner'].map((v,i)=>`<article class="card"><img class="venue-img" src="https://images.unsplash.com/photo-${['1497366811353-6870744d04b2','1497366754035-f200968a6e72','1524758631624-e2822e304c36'][i]}?auto=format&fit=crop&w=700&q=80" alt="Illustrative workspace"><h3>${v}</h3><p>Dubai · Sample venue<br>Monday–Friday · 09:00–18:00 GST</p><span class="tag">Wi-Fi</span><span class="tag">Power</span><span class="tag">Meeting rooms</span><p class="small">Paid access · Confirm conditions with venue.<br>First visits do not earn return-visit points.</p><button class="linkbtn" onclick="open('<h2>${v}</h2><p>Sample weekday hours: 09:00–18:00 UAE time. Weekend: closed. Holiday exceptions require confirmation.</p><h3>Before you go</h3><p>Wi-Fi, desks, sockets and meeting rooms. Accessible entry and parking details would be confirmed on a live profile.</p><button class=btn onclick=checkin()>Explore check-in ↗</button>')">Explore venue ↗</button></article>`).join('')}</div></div>`}function checkin(){toast('Demo only. A genuine venue-confirmed visit would be required.');modal.close()}
function dashboard(view='Overview'){const investor=memberRole==='Investor',venue=memberRole==='Venue';app.innerHTML=`<div class="wrap dashboard page"><aside class="sidebar"><div><div class="eyebrow">Your workspace</div><h3>Nexus / Demo</h3><select aria-label="Switch demo role" onchange="memberRole=this.value;dashboard()">${roles.map(r=>`<option ${r===memberRole?'selected':''}>${r}</option>`).join('')}</select></div>${['Overview','Projects','Teams','Payments','Verification','Loyalty','Help'].map(v=>`<button class="${view===v?'active':''}" onclick="dashboard('${v}')">${v}</button>`).join('')}</aside><section><div class="eyebrow">${memberRole} workspace · Demonstration data</div><div class="section-head"><h2>${view==='Overview'?'Make room for<br>your next possibility.':view}</h2><button class="btn" onclick="${investor?"pitch()":venue?"toast('Venue profile editing is a planned live feature.')":"post()"}">${investor?'Review a pitch':venue?'Edit venue profile':'Create a brief + '}</button></div>${dashContent(view,investor,venue)}</section></div>`}
function dashContent(v,inv,ven){if(v==='Verification')return `<div class="card"><span class="tag">Pending · Demo</span><h3>Build trust with clear checks.</h3><p>Identity, visa or licence eligibility and payout onboarding are separate steps. Verification provider selection is pending.</p>${['Profile information','Identity check','UAE visa / trade licence review','Payout onboarding'].map((s,i)=>`<div class="meta"><b>${s}</b><span>${i===0?'Draft complete':'Not started'}</span></div>`).join('')}<p>No documents are collected in this prototype.</p><button class="btn" onclick="toast('Provider integration is not connected. No verification was performed.')">Preview verification step ↗</button></div>`;if(v==='Payments')return `<div class="card"><h3>Funding and payouts</h3><p>Sample project: Brand launch / AED 12,000. Delivery and financial status remain separate.</p>${['Funding required','Funding confirmed','Payout pending','Processing','Paid'].map((x,i)=>`<div class="meta"><span>${x}</span><b>${stage===i?'Current demo state':'—'}</b></div>`).join('')}<button class="btn" style="margin-top:25px" onclick="stage=(stage+1)%5;dashboard('Payments')">Simulate next state ↗</button><p class="small">No charge or transfer occurs. Fees and provider rules remain to be agreed.</p></div>`;if(v==='Loyalty')return loyaltyContent();if(v==='Teams')return `<div class="empty"><h3>More capability. One clear proposal.</h3><p>Invite accepted collaborators, assign roles and identify the contracting lead before submitting a joint proposal.</p><button class="btn" onclick="invite()">Create a demo team +</button></div>`;if(v==='Help')return helpContent();if(inv)return `<div class="stats"><div class="card">Sample pitches<strong>3</strong>Under review</div><div class="card">Meetings<strong>1</strong>Requested</div><div class="card">Confirmed investments<strong>0</strong>Evidence required</div></div><div class="card"><span class="tag">Confidential pitch · Demo</span><h3>A simpler way to reuse packaging</h3><p>Seed stage · Circular economy · UAE<br>Founder-controlled access to pitch materials.</p><button class="btn" onclick="pitch()">Review sample pitch ↗</button></div>`;if(ven)return `<div class="stats"><div class="card">Confirmed visits<strong>12</strong>Fictional sample</div><div class="card">Repeat visits<strong>4</strong>Fictional sample</div><div class="card">Experience rating<strong>4.6 / 5</strong>Fictional sample</div></div><div class="card"><h3>Today at your venue</h3><p>Opening hours: 09:00–18:00 UAE time. Check-in confirmation and genuine visit reviews would appear here.</p><button class="btn" onclick="toast('Demo visit confirmed. No loyalty points were issued.')">Simulate visit confirmation</button></div>`;return `<div class="stats"><div class="card">Sample active projects<strong>3</strong><span class="small">Across delivery stages</span></div><div class="card">Sample milestone value<strong>AED 4,000</strong><span class="small">Funding required</span></div><div class="card">Nexus Dirham<strong>2 points</strong><span class="small">Blue tier · Sample balance</span></div></div><div class="card" style="margin-bottom:25px"><span class="tag">Next useful step</span><h3>Complete your profile and eligibility checks.</h3><p>Show your capabilities clearly before you join live opportunities.</p><button class="linkbtn" onclick="dashboard('Verification')">Review verification steps →</button></div><h3>Your delivery board</h3><div class="board">${['To start','Ongoing','Finished'].map((s,i)=>`<div class="column"><b>${s} <span class="small">/ 1</span></b><article class="card"><span class="tag">Sample project</span><h3>${['Brand launch','Booking experience','Content toolkit'][i]}</h3><p class="small">${['Scope agreed · Funding required','Milestone 1 in progress','Accepted · Rating recorded'][i]}<br>Start 9 Nov · Due 30 Nov 2026</p><button class="linkbtn" onclick="delivery(${i})">Open workspace ↗</button></article></div>`).join('')}</div>`}
function delivery(i){open(`<span class="tag">Demo project workspace</span><h2>${['Brand launch','Booking experience','Content toolkit'][i]}</h2><p>Client: Sample Business · Delivery lead: Demo Member<br>Scope, milestones and accepted team roles stay visible here.</p><div class="meta"><b>1 / Discovery and direction</b><span>AED 4,000</span></div><div class="meta"><b>2 / Delivery and handover</b><span>AED 8,000</span></div><h3>Review a submission</h3><form onsubmit="event.preventDefault();modal.close();toast('Demo completion accepted and rating recorded. No payout or points issued.')"><label class="label">Your rating</label><select required><option value="">Select a rating</option>${[1,2,3,4,5].map(x=>`<option>${x} star${x>1?'s':''}</option>`).join('')}</select><label class="label">Review note</label><textarea placeholder="Share a fair account of the engagement"></textarea><button class="btn" style="margin-top:20px">Accept demo delivery</button><button type="button" class="btn ghost" onclick="toast('Demo revision requested.')">Request revision</button></form>`)}
function pitch(){open('<span class="tag">Sample pitch</span><h2>Good ideas deserve<br>a useful introduction.</h2><p>Problem: single-use packaging waste.<br>Solution: a reusable packaging collection network.<br>Stage: seed · Team: 2 founders · Amount sought: AED 500,000.</p><p>A meeting or expression of interest does not count as an investment. Nexus does not process investment transfers in this prototype.</p><button class="btn" onclick="toast(\'Demo meeting requested. No message was sent.\');modal.close()">Request demo meeting ↗</button>')}
function loyaltyContent(){return `<div class="card"><span class="tag">Blue · Default membership tier</span><h2>Progress earns recognition.</h2><p>Nexus Dirham is a loyalty point, separate from AED money. Sample balance: <b>2 points</b>.</p>${[['Accepted project completion','Eligible freelancer / agency'],['Verified return to the same venue','Eligible freelancer / agency'],['Project posted and successfully awarded','Commissioning business'],['Investment made and confirmed','Investor']].map(x=>`<div class="meta"><span>${x[0]}<p class="small">${x[1]}</p></span><b>+1 point</b></div>`).join('')}<p>Blue → Silver → Gold → Platinum. Thresholds, benefits and expiry rules are to be defined. No invented benefits are offered.</p></div>`}
function helpContent(){return `<h3>Clear answers. Useful next steps.</h3>${[['Who can join?','Eligible UAE freelancers and businesses. Freelancers need an existing valid UAE freelance visa; businesses need an existing valid UAE trade licence.'],['Does Nexus issue visas or licences?','No. Nexus does not issue or arrange visas, permits or trade licences.'],['What does verified mean?','Identity, eligibility and payout checks are distinct. Live badges must identify the checks actually completed. This prototype performs none.'],['How are projects completed?','The supplier submits deliverables; the client reviews, accepts and provides a 1–5 star rating. Exceptions require a recorded resolution.'],['Are payments live?','No. All funding, payout and loyalty states here are simulated.'],['Can I pitch as a team?','Yes. The planned journey records accepted participants, their roles and the contracting lead.']].map(x=>`<details class="card" style="margin:10px 0"><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}`}
function research(){app.innerHTML=`<div class="wrap section page"><div class="eyebrow">Strategic & creative direction / 7 November 2026</div><h2>A connected ecosystem,<br>with a clear next step.</h2><p>Benchmark observations concern public product positioning and journeys, not audited private features. These brands are selected reference points, not an objective ranking.</p><div class="grid">${[['Contra / USA','Portfolio-led discovery','Put work and capabilities before generic directory listings.','https://contra.com/how-it-works/independents'],['A.Team / New York','Complementary teams','Make roles and team responsibility explicit. Its current offer also emphasises AI systems; Nexus should retain its own broader member model.','https://www.a.team/about'],['YunoJuno / London','Operational clarity','Connect sourcing with onboarding, delivery and payment visibility.','https://www.yunojuno.com/'],['Malt / Europe','Decision-ready profiles','Present rates, capabilities and reviews clearly before contact.','https://www.malt.com/c/companies/freelancer-marketplace'],['Welcome to the Jungle / Paris & London','Human context','Show people, working environments and meaningful profile detail.','https://help.welcometothejungle.com/en/understanding-a-companys-showcase-page'],['SeedLegals / UK','Investor preparation','Separate pitch readiness, access to material and confirmed investment. Do not imply guaranteed backing.','https://seedlegals.com/pricing/']].map(x=>`<article class="card"><span class="eyebrow">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p><a class="linkbtn" href="${x[3]}" target="_blank" rel="noopener">Reference ↗</a></article>`).join('')}</div><section class="blue-panel" style="margin-top:30px"><h2>Independent minds.<br>Shared possibilities.</h2><p>Nexus’s opportunity is continuity: discover people, agree a team, deliver a project and build a reputation in one UAE ecosystem. Lead with projects and capability; treat investors and venues as distinct, connected journeys.</p><p>Creative approach: established Nexus blue, ink and white; bold editorial headlines; human collaboration imagery; clear cards for discovery; restrained workspaces for complex tasks. Production logo masters remain to be integrated; the prototype uses a text wordmark.</p></section><h3>Recommended pilot sequence</h3><p>Start with freelancers, agencies and commissioning businesses in a small number of categories. Validate brief quality, proposals, awards and accepted delivery before expanding venue engagement and investor introductions. Track qualified applications, time to award, completion, repeat clients and payout reliability.</p><h3>Prototype boundaries</h3><p>Browser-only interactions and fictional records. No authentication, document verification, backend persistence, payments, message delivery or real investments. Reloading resets demo state. Provider selection, fees, team payout policy, loyalty thresholds and operating policies remain open decisions.</p></div>`}
function render(){query='';category='All';const p=location.hash.slice(1)||'home';if(p==='home')home();else if(p==='projects')projectPage();else if(p==='people')people();else if(p==='venues')venues();else if(p==='dashboard')dashboard();else if(p==='research')research();else if(p==='loyalty')app.innerHTML='<div class="wrap section page">'+loyaltyContent()+'</div>';else if(p==='help')app.innerHTML='<div class="wrap section page">'+helpContent()+'</div>';else if(p==='how'){home();setTimeout(()=>document.querySelector('.dark').scrollIntoView({behavior:'smooth'}),0)}else home();window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
</script></body></html>
