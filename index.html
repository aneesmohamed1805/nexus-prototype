function projectPage(){app.innerHTML=`<div class="wrap section page"><div class="eyebrow">Find your next possibility</div><h1 style="font-size:60px">Good work starts<br>with a <span>good connection.</span></h1><p>Explore sample briefs. Apply independently or bring a team.</p><div class="search"><input aria-label="Search projects" placeholder="Search skills, projects or locations" id="q"><button class="btn" onclick="query=$('#q').value;$('#results').innerHTML=cards()">Search ↗</button><button class="btn ghost" onclick="post()">Post a brief +</button></div><div class="tabs">${['All','Brand & design','Development','Marketing','Content'].map(c=>`<button class="tab ${category===c?'active':''}" onclick="category='${c}';projectPage()">${c}</button>`).join('')}</div><div class="grid" id="results">${cards()}</div></div>`;$('#q').value=query;$('#q').oninput=e=>{query=e.target.value;$('#results').innerHTML=cards()}}
function detail(i){const p=projects[i];open(`<span class="tag">Sample project · ${p[4]}</span><h2>${p[1]}</h2><p>${p[2]}</p><div class="meta"><b>AED ${p[3]}</b><span>${p[5]}</span></div><h3>What success looks like</h3><p>A clear plan, agreed milestones and accepted deliverables. This sample brief is for exploring the proposal journey.</p><h3>Your proposal</h3><form onsubmit="event.preventDefault();modal.close();toast('Demo proposal submitted. No application has been sent.')"><label class="label">Proposal type</label><select><option>Individual</option><option>Joint team proposal</option></select><label class="label">Your approach</label><textarea required rows="3" placeholder="Explain how you would approach the brief"></textarea><label class="label">Proposed fee (AED)</label><input required type="number" min="1"><button class="btn" style="margin-top:20px">Submit demo proposal ↗</button></form>`)}
function join(r='Freelancer'){memberRole=r;open(`<div class="eyebrow">Find your place in Nexus</div><h2>What will you<br>build next?</h2><p>Explore the registration journey. Do not enter real identity documents or financial information.</p><form onsubmit="event.preventDefault();modal.close();go('dashboard');toast('Demo profile created. Verification remains pending.')"><label class="label">I am joining as a</label><select onchange="memberRole=this.value">${roles.map(x=>`<option ${x===r?'selected':''}>${x}</option>`).join('')}</select><div class="form-grid"><div><label class="label">Display name</label><input required placeholder="Sample name"></div><div><label class="label">Emirate</label><select><option>Dubai</option><option>Abu Dhabi</option><option>Sharjah</option><option>Ajman</option><option>Fujairah</option><option>Ras Al Khaimah</option><option>Umm Al Quwain</option></select></div></div><p class="small">Eligibility: existing valid UAE freelance visa for freelancers; valid UAE trade licence for businesses. Nexus does not issue visas or licences.</p><button class="btn">Create demo profile ↗</button></form>`)}
function post(){open(`<h2>Start with a clear brief.</h2><form onsubmit="event.preventDefault();modal.close();toast('Demo brief saved. It has not been published to a live marketplace.')"><label class="label">Project title</label><input required><label class="label">What do you need?</label><textarea required rows="4"></textarea><div class="form-grid"><div><label class="label">Budget (AED)</label><input required type="number" min="1"></div><div><label class="label">Target date</label><input required type="date"></div></div><button class="btn" style="margin-top:20px">Save demo brief ↗</button></form>`)}
function people(){app.innerHTML=`<div class="wrap section page"><div class="eyebrow">Independent capability. Shared ambition.</div><h2>Find your next collaborator.</h2><p>Fictional profiles show how people and agencies could present their capabilities.</p><div class="grid">${[['AL','Amal Latif','Brand strategist','Freelancer','Strategy · Positioning · Research'],['OS','Orbit Studio','Digital experiences','Small agency','UX · Development · Content'],['RK','Rohan Kumar','Product designer','Freelancer','Product design · Prototyping · UI']].map(p=>`<article class="card"><div class="avatar">${p[0]}</div><h3>${p[1]}</h3><span class="tag">${p[3]}</span><p>${p[2]}<br>${p[4]}</p><div class="small">Dubai · Sample profile · Verification pending</div><div class="meta"><button class="linkbtn" onclick="open('<h2>${p[1]}</h2><p>${p[2]} · ${p[4]}</p><h3>Selected work</h3><p>Portfolio case studies would show the challenge, contribution and outcome, with genuine project evidence.</p><button class=btn onclick=invite()>Invite to a team ↗</button>')">View profile ↗</button><button class="linkbtn" onclick="invite()">Connect +</button></div></article>`).join('')}</div><div class="blue-panel" style="margin-top:30px"><h2>Keep your independence.<br>Add the missing capability.</h2><p>Build a joint proposal with named roles and accepted team invitations.</p><button class="btn ghost" onclick="invite()">Build a team ↗</button></div></div>`}function invite(){open('<h2>Build your next team.</h2><p>Invite collaborators and agree who leads, who delivers and who contracts.</p><form onsubmit="event.preventDefault();modal.close();toast(\'Demo invitation recorded. No message has been sent.\')"><label class="label">Team name</label><input required><label class="label">Your collaborator’s role</label><input required placeholder="e.g. UX design"><button class="btn" style="margin-top:20px">Create demo invitation ↗</button></form>')}
function venues(){app.innerHTML=`<div class="wrap section page"><div class="eyebrow">A space for every kind of progress</div><h2>Find your work mode.</h2><p>Sample venues only. Hours, facilities and access conditions illustrate the planned experience.</p><div class="grid">${['The Workroom','Common Ground','Studio Corner'].map((v,i)=>`<article class="card"><img class="venue-img" src="https://images.unsplash.com/photo-${['1497366811353-6870744d04b2','1497366754035-f200968a6e72','1524758631624-e2822e304c36'][i]}?auto=format&fit=crop&w=700&q=80" alt="Illustrative workspace"><h3>${v}</h3><p>Dubai · Sample venue<br>Monday–Friday · 09:00–18:00 GST</p><span class="tag">Wi-Fi</span><span class="tag">Power</span><span class="tag">Meeting rooms</span><p class="small">Paid access · Confirm conditions with venue.<br>First visits do not earn return-visit points.</p><button class="linkbtn" onclick="open('<h2>${v}</h2><p>Sample weekday hours: 09:00–18:00 UAE time. Weekend: closed. Holiday exceptions require confirmation.</p><h3>Before you go</h3><p>Wi-Fi, desks, sockets and meeting rooms. Accessible entry and parking details would be confirmed on a live profile.</p><button class=btn onclick=checkin()>Explore check-in ↗</button>')">Explore venue ↗</button></article>`).join('')}</div></div>`}function checkin(){toast('Demo only. A genuine venue-confirmed visit would be required.');modal.close()}
function dashboard(view='Overview'){const investor=memberRole==='Investor',venue=memberRole==='Venue';app.innerHTML=`<div class="wrap dashboard page"><aside class="sidebar"><div><div class="eyebrow">Your workspace</div><h3>Nexus / Demo</h3><select aria-label="Switch demo role" onchange="memberRole=this.value;dashboard()">${roles.map(r=>`<option ${r===memberRole?'selected':''}>${r}</option>`).join('')}</select></div>${['Overview','Projects','Teams','Payments','Verification','Loyalty','Help'].map(v=>`<button class="${view===v?'active':''}" onclick="dashboard('${v}')">${v}</button>`).join('')}</aside><section><div class="eyebrow">${memberRole} workspace · Demonstration data</div><div class="section-head"><h2>${view==='Overview'?'Make room for<br>your next possibility.':view}</h2><button class="btn" onclick="${investor?"pitch()":venue?"toast('Venue profile editing is a planned live feature.')":"post()"}">${investor?'Review a pitch':venue?'Edit venue profile':'Create a brief + '}</button></div>${dashContent(view,investor,venue)}</section></div>`}
function dashContent(v,inv,ven){if(v==='Verification')return `<div class="card"><span class="tag">Pending · Demo</span><h3>Build trust with clear checks.</h3><p>Identity, visa or licence eligibility and payout onboarding are separate steps. Verification provider selection is pending.</p>${['Profile information','Identity check','UAE visa / trade licence review','Payout onboarding'].map((s,i)=>`<div class="meta"><b>${s}</b><span>${i===0?'Draft complete':'Not started'}</span></div>`).join('')}<p>No documents are collected in this prototype.</p><button class="btn" onclick="toast('Provider integration is not connected. No verification was performed.')">Preview verification step ↗</button></div>`;if(v==='Payments')return `<div class="card"><h3>Funding and payouts</h3><p>Sample project: Brand launch / AED 12,000. Delivery and financial status remain separate.</p>${['Funding required','Funding confirmed','Payout pending','Processing','Paid'].map((x,i)=>`<div class="meta"><span>${x}</span><b>${stage===i?'Current demo state':'—'}</b></div>`).join('')}<button class="btn" style="margin-top:25px" onclick="stage=(stage+1)%5;dashboard('Payments')">Simulate next state ↗</button><p class="small">No charge or transfer occurs. Fees and provider rules remain to be agreed.</p></div>`;if(v==='Loyalty')return loyaltyContent();if(v==='Teams')return `<div class="empty"><h3>More capability. One clear proposal.</h3><p>Invite accepted collaborators, assign roles and identify the contracting lead before submitting a joint proposal.</p><button class="btn" onclick="invite()">Create a demo team +</button></div>`;if(v==='Help')return helpContent();if(inv)return `<div class="stats"><div class="card">Sample pitches<strong>3</strong>Under review</div><div class="card">Meetings<strong>1</strong>Requested</div><div class="card">Confirmed investments<strong>0</strong>Evidence required</div></div><div class="card"><span class="tag">Confidential pitch · Demo</span><h3>A simpler way to reuse packaging</h3><p>Seed stage · Circular economy · UAE<br>Founder-controlled access to pitch materials.</p><button class="btn" onclick="pitch()">Review sample pitch ↗</button></div>`;if(ven)return `<div class="stats"><div class="card">Confirmed visits<strong>12</strong>Fictional sample</div><div class="card">Repeat visits<strong>4</strong>Fictional sample</div><div class="card">Experience rating<strong>4.6 / 5</strong>Fictional sample</div></div><div class="card"><h3>Today at your venue</h3><p>Opening hours: 09:00–18:00 UAE time. Check-in confirmation and genuine visit reviews would appear here.</p><button class="btn" onclick="toast('Demo visit confirmed. No loyalty points were issued.')">Simulate visit confirmation</button></div>`;return `<div class="stats"><div class="card">Sample active projects<strong>3</strong><span class="small">Across delivery stages</span></div><div class="card">Sample milestone value<strong>AED 4,000</strong><span class="small">Funding required</span></div><div class="card">Nexus Dirham<strong>2 points</strong><span class="small">Blue tier · Sample balance</span></div></div><div class="card" style="margin-bottom:25px"><span class="tag">Next useful step</span><h3>Complete your profile and eligibility checks.</h3><p>Show your capabilities clearly before you join live opportunities.</p><button class="linkbtn" onclick="dashboard('Verification')">Review verification steps →</button></div><h3>Your delivery board</h3><div class="board">${['To start','Ongoing','Finished'].map((s,i)=>`<div class="column"><b>${s} <span class="small">/ 1</span></b><article class="card"><span class="tag">Sample project</span><h3>${['Brand launch','Booking experience','Content toolkit'][i]}</h3><p class="small">${['Scope agreed · Funding required','Milestone 1 in progress','Accepted · Rating recorded'][i]}<br>Start 9 Nov · Due 30 Nov 2026</p><button class="linkbtn" onclick="delivery(${i})">Open workspace ↗</button></article></div>`).join('')}</div>`}
function delivery(i){open(`<span class="tag">Demo project workspace</span><h2>${['Brand launch','Booking experience','Content toolkit'][i]}</h2><p>Client: Sample Business · Delivery lead: Demo Member<br>Scope, milestones and accepted team roles stay visible here.</p><div class="meta"><b>1 / Discovery and direction</b><span>AED 4,000</span></div><div class="meta"><b>2 / Delivery and handover</b><span>AED 8,000</span></div><h3>Review a submission</h3><form onsubmit="event.preventDefault();modal.close();toast('Demo completion accepted and rating recorded. No payout or points issued.')"><label class="label">Your rating</label><select required><option value="">Select a rating</option>${[1,2,3,4,5].map(x=>`<option>${x} star${x>1?'s':''}</option>`).join('')}</select><label class="label">Review note</label><textarea placeholder="Share a fair account of the engagement"></textarea><button class="btn" style="margin-top:20px">Accept demo delivery</button><button type="button" class="btn ghost" onclick="toast('Demo revision requested.')">Request revision</button></form>`)}
function pitch(){open('<span class="tag">Sample pitch</span><h2>Good ideas deserve<br>a useful introduction.</h2><p>Problem: single-use packaging waste.<br>Solution: a reusable packaging collection network.<br>Stage: seed · Team: 2 founders · Amount sought: AED 500,000.</p><p>A meeting or expression of interest does not count as an investment. Nexus does not process investment transfers in this prototype.</p><button class="btn" onclick="toast(\'Demo meeting requested. No message was sent.\');modal.close()">Request demo meeting ↗</button>')}
function loyaltyContent(){return `<div class="card"><span class="tag">Blue · Default membership tier</span><h2>Progress earns recognition.</h2><p>Nexus Dirham is a loyalty point, separate from AED money. Sample balance: <b>2 points</b>.</p>${[['Accepted project completion','Eligible freelancer / agency'],['Verified return to the same venue','Eligible freelancer / agency'],['Project posted and successfully awarded','Commissioning business'],['Investment made and confirmed','Investor']].map(x=>`<div class="meta"><span>${x[0]}<p class="small">${x[1]}</p></span><b>+1 point</b></div>`).join('')}<p>Blue → Silver → Gold → Platinum. Thresholds, benefits and expiry rules are to be defined. No invented benefits are offered.</p></div>`}
function helpContent(){return `<h3>Clear answers. Useful next steps.</h3>${[['Who can join?','Eligible UAE freelancers and businesses. Freelancers need an existing valid UAE freelance visa; businesses need an existing valid UAE trade licence.'],['Does Nexus issue visas or licences?','No. Nexus does not issue or arrange visas, permits or trade licences.'],['What does verified mean?','Identity, eligibility and payout checks are distinct. Live badges must identify the checks actually completed. This prototype performs none.'],['How are projects completed?','The supplier submits deliverables; the client reviews, accepts and provides a 1–5 star rating. Exceptions require a recorded resolution.'],['Are payments live?','No. All funding, payout and loyalty states here are simulated.'],['Can I pitch as a team?','Yes. The planned journey records accepted participants, their roles and the contracting lead.']].map(x=>`<details class="card" style="margin:10px 0"><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}`}
function research(){app.innerHTML=`<div class="wrap section page"><div class="eyebrow">Strategic & creative direction / 7 November 2026</div><h2>A connected ecosystem,<br>with a clear next step.</h2><p>Benchmark observations concern public product positioning and journeys, not audited private features. These brands are selected reference points, not an objective ranking.</p><div class="grid">${[['Contra / USA','Portfolio-led discovery','Put work and capabilities before generic directory listings.','https://contra.com/how-it-works/independents'],['A.Team / New York','Complementary teams','Make roles and team responsibility explicit. Its current offer also emphasises AI systems; Nexus should retain its own broader member model.','https://www.a.team/about'],['YunoJuno / London','Operational clarity','Connect sourcing with onboarding, delivery and payment visibility.','https://www.yunojuno.com/'],['Malt / Europe','Decision-ready profiles','Present rates, capabilities and reviews clearly before contact.','https://www.malt.com/c/companies/freelancer-marketplace'],['Welcome to the Jungle / Paris & London','Human context','Show people, working environments and meaningful profile detail.','https://help.welcometothejungle.com/en/understanding-a-companys-showcase-page'],['SeedLegals / UK','Investor preparation','Separate pitch readiness, access to material and confirmed investment. Do not imply guaranteed backing.','https://seedlegals.com/pricing/']].map(x=>`<article class="card"><span class="eyebrow">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p><a class="linkbtn" href="${x[3]}" target="_blank" rel="noopener">Reference ↗</a></article>`).join('')}</div><section class="blue-panel" style="margin-top:30px"><h2>Independent minds.<br>Shared possibilities.</h2><p>Nexus’s opportunity is continuity: discover people, agree a team, deliver a project and build a reputation in one UAE ecosystem. Lead with projects and capability; treat investors and venues as distinct, connected journeys.</p><p>Creative approach: established Nexus blue, ink and white; bold editorial headlines; human collaboration imagery; clear cards for discovery; restrained workspaces for complex tasks. The supplied Nexus logo artwork and original split-X geometry are retained. Campaign mockups are drawn from the established 16-image collection.</p></section><h3>Recommended pilot sequence</h3><p>Start with freelancers, agencies and commissioning businesses in a small number of categories. Validate brief quality, proposals, awards and accepted delivery before expanding venue engagement and investor introductions. Track qualified applications, time to award, completion, repeat clients and payout reliability.</p><h3>Prototype boundaries</h3><p>Browser-only interactions and fictional records. No authentication, document verification, backend persistence, payments, message delivery or real investments. Reloading resets demo state. Provider selection, fees, team payout policy, loyalty thresholds and operating policies remain open decisions.</p></div>`}
function investment(){app.innerHTML=`<div class="wrap section page"><div class="eyebrow">Ideas. People. Potential backers.</div><h1 style="font-size:64px;text-transform:uppercase">YOUR IDEA.<br><span>YOUR NEXT PITCH.</span></h1><p>Connect with investors whose interests match your ambition. Pitch independently or bring your team.</p><div class="actions"><button class="btn" onclick="pitch()">Pitch your idea ↗</button><button class="btn ghost" onclick="join('Investor')">Join as an investor</button></div><div class="grid">${[['Cedar Ventures','Early stage','Technology · B2B platforms'],['Forward Capital','Seed / growth','Sustainability · Circular economy'],['Independent Angels','Pre-seed / seed','Creative economy · Consumer services']].map(x=>`<article class="card"><span class="tag">Fictional investor profile</span><h3>${x[0]}</h3><p>${x[1]}<br>${x[2]}<br>UAE focus</p><p class="small">Investment range and track record would be self-declared until checked. No funding commitment is implied.</p><button class="linkbtn" onclick="pitch()">Explore pitch fit ↗</button></article>`).join('')}</div><section class="blue-panel" style="margin-top:35px"><h2>ONE IDEA.<br>THE RIGHT CONVERSATION.</h2><p>Define the problem, solution, market, team, stage and funding sought. Control access to confidential pitch materials. Investor interest and meetings stay separate from confirmed investment.</p><button class="btn ghost" onclick="invite()">Build a pitch team ↗</button></section><p class="small">Prototype only. Profiles are fictional; no pitches are sent and no investment transfers are processed.</p></div>`}
function render(){query='';category='All';const p=location.hash.slice(1)||'home';if(p==='home')home();else if(p==='projects')projectPage();else if(p==='people')people();else if(p==='venues')venues();else if(p==='investment')investment();else if(p==='dashboard')dashboard();else if(p==='research')research();else if(p==='loyalty')app.innerHTML='<div class="wrap section page">'+loyaltyContent()+'</div>';else if(p==='help')app.innerHTML='<div class="wrap section page">'+helpContent()+'</div>';else if(p==='how'){home();setTimeout(()=>document.querySelector('.dark').scrollIntoView({behavior:'smooth'}),0)}else home();window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
</script></body></html>
